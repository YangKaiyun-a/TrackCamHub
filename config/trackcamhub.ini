# TrackCamHub configuration.
# Lines are parsed as key=value. Unknown keys are ignored.

# Upper-computer Thrift server. Cameras call TaskInfoChanged on this port.
hub.uc_server_port=7080

# Camera ids define the runtime channels. Each id binds one camera to one track serial port.
camera.ids=camera-1,camera-2

camera.camera-1.host=127.0.0.1
camera.camera-1.port=7082
camera.camera-1.heartbeat_interval_ms=1000
camera.camera-1.heartbeat_fail_max=3
camera.camera-1.capture_timeout_ms=15000
camera.camera-1.poll_interval_ms=200
camera.camera-1.image_capture_enabled=true
track.camera-1.serial_enabled=true
track.camera-1.port=COM3
track.camera-1.baud_rate=115200
track.camera-1.ready_command=0x00

camera.camera-2.host=10.18.93.229
camera.camera-2.port=7082
camera.camera-2.heartbeat_interval_ms=1000
camera.camera-2.heartbeat_fail_max=3
camera.camera-2.capture_timeout_ms=15000
camera.camera-2.poll_interval_ms=200
camera.camera-2.image_capture_enabled=true
track.camera-2.serial_enabled=true
track.camera-2.port=COM7
track.camera-2.baud_rate=115200
track.camera-2.ready_command=0x00

# Local TCP trigger for camera-only debugging. It triggers the first configured camera.
direct_trigger.enabled=true
direct_trigger.host=127.0.0.1
direct_trigger.port=7090
